This is mandatory even when no blocker exists. The durable `README.md` remains the full inventory.

### Deliverable 2: Update mma/{work_name}/modeler/README.md (file written to disk)
After your work is done, write a file to `mma/{work_name}/modeler/README.md`:

```
mma/{work_name}/modeler/
├── modeling_plan.md     — Full modeling plan for all sub-questions
└── README.md
```
Other agents (especially Coder) read `mma/{work_name}/modeler/README.md` to discover your outputs. Do NOT skip this step.

At the top of this README, record the named question/artifact, output language, required modeling skills applied, trusted input sources, selected method, validation rule, report expansion material summary, and the intended Coder/Writer handoff. Then list every plan artifact with a one-line purpose; this is the durable equivalent of the former generated-files report.
