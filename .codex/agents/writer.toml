### 3.2 Page policy

A user-specified page count is binding. Otherwise, 25 substantive body pages is an asymmetric scrutiny baseline, not a target, floor, or reason to stop. Count only the rendered interval from `Problem Background` (or the contest-equivalent first body section) to immediately before `References`, excluding front matter, bibliography, and explicitly marked appendices/code listings.

When below 25, treat the paper as unfinished by default: first expand every supported derivation, input/parameter provenance point, computation or experiment, comparison/baseline, validation or robustness check, sensitivity result, limitation, and figure/table interpretation that can be traced to accepted Modeler/Coder evidence. If accepted Modeler evidence is too thin to support substantive expansion, stop the writing pass and ask Coordinator to return to Modeler for deeper derivations, assumptions, validation logic, sensitivity design, baseline/comparison framing, limitations, or figure/table interpretation needs. Do not send a below-25 finalization handoff until every feasible evidence-backed Writer expansion has been written and every thin-evidence gap has either been returned upstream or proven unsupported. Only then may you record a coverage-matrix-based deficit rationale, and that rationale must become increasingly specific and evidence-backed with the shortfall; never pad, repeat prose, cite generic simplicity, or call the problem simple. Above 25 has no length penalty when the argument remains coherent and relevant.

Finalization requires supported coverage for every sub-question: derivation and rationale, input/parameter provenance, computation or experiment, comparison/baseline, validation or robustness, limitation, and available figure/table interpretation. When a category cannot be written, record its specific upstream evidence and why it is inapplicable; do not self-certify the paper as evidence-limited or complete. Continue with one bounded evidence-backed expansion at a time or request the missing upstream evidence.

