## 5. Contest Paper Writing Style

The following style principles apply to all mathematical modeling contest papers. These define how you write, regardless of which template or SKILL you use.

### 5.1 Problem-Driven Narrative

The report is a problem-solving narrative, not a template-filling exercise. Every section must directly serve the goal of answering the contest questions.

Use "we" as the collective subject throughout (Chinese: "我们"; English: "we"). Write from the perspective of a team solving a real problem, not a textbook explaining theory.

For Chinese papers, adopt the phrasing "针对问题X" to introduce each sub-problem. For example: "针对问题一，我们注意到原始数据中存在明显的周期性波动，因此首先对时间序列进行季节性分解..." rather than "本节使用 ARIMA 模型进行时间序列预测".

For English papers, use "For Problem X, we..." phrasing. For example: "For Problem 2, we observe that the spatial distribution of fires follows a clustered pattern, which motivates our use of..." rather than "This section presents a spatial model."

### 5.2 Motivation Before Model

Before introducing any mathematical model, first explain the motivation: what observation, data pattern, or analytical reasoning led to choosing this particular approach. This shows the reader that the model choice is driven by understanding, not arbitrary selection.

Bad: "我们使用随机森林模型进行预测。随机森林的目标函数为..."
Good: "针对问题二，我们对训练数据进行探索性分析后发现，自变量之间存在复杂的非线性交互关系（见图~\ref{fig:q2_corr}），且数据维度较高（共 47 个特征）。这些特征使得线性模型难以捕捉数据的内在结构。因此，我们选择随机森林模型，它天然支持高维非线性建模且具有良好的抗过拟合能力。"

### 5.3 Quantitative Results

Every conclusion must be backed by specific numerical evidence. Avoid vague qualitative statements.

Bad: "模型效果较好，预测精度较高。"
Good: "模型的 $R^2$ 达到 0.943，RMSE 为 8.7，AIC 为 2408，较基准模型的 AIC = 2762 降低了 12.8%。"

Bad: "The model performs well on the validation set."
Good: "The model achieves an F1 score of 0.87 on the 5-fold cross-validation, outperforming logistic regression (F1 = 0.71) by 22.5%."

### 5.4 Paragraph Integrity and Flow

Write in coherent paragraphs, not bullet-point lists. Each paragraph has a central argument developed in 3-5 sentences. A section full of bullet lists creates an impression of shallow analysis.

Prohibited: Do NOT use `\begin{itemize}` or `\begin{enumerate}` environments except where the template explicitly provides them (e.g., notation tables).
Alternative: Use transitional phrases within standard paragraphs ("首先...此外...最后..." / "First... Furthermore... Finally...").

Prohibited: Never use `\textbf{}`, `\textit{}`, or `\emph{}` for emphasis in body text.

Avoid stacked headings: never place consecutive `\section`, `\subsection`, or `\subsubsection` commands without at least one paragraph of descriptive or transitional text between them.

Never leak Markdown formatting (such as ** or _) into LaTeX files.

Write natural professional prose in the required language. Vary sentence structure when the argument changes, connect each paragraph to the observed evidence and the next analytical step, and prefer precise verbs and concrete referents over stock transitions or inflated claims. Remove mechanical repetitions such as identical sentence openings, empty "it is worth noting" statements, and translation-like word order. Naturalness never permits invented evidence, informal tone, or vague conclusions.

Use `paper-writer`, when available, only as a subordinate evidence-to-prose check for the currently assigned artifact: decide each paragraph's claim, direct evidence, interpretation, and role before writing it, but keep that scaffold out of the paper. It must not narrow the assigned artifact or suppress evidence-backed detail. For a too-short report, prioritize the native expansion contract: derive the model step by step, explain method motivation, interpret every figure/table, report baselines and validation, add sensitivity/robustness and limitations, and request upstream evidence when those materials are missing. Do not add unsupported padding, but do not delete supported substance merely to satisfy generic brevity. Use `paper-polish` only in its own bounded pass after the technical content is accepted. A polished paragraph must preserve all mathematical meaning and numerical values while removing formulaic transitions, inflated claims, translation residue, repetitive sentence openings, and generic AI-sounding phrases.

### 5.5 Formula-Text Integration

Use as many equations and calculation displays as the accepted model requires to make its derivation, solution, and validation reproducible. Do not omit intermediate definitions, parameter calculations, objective terms, update rules, or evaluation formulas merely to make a chapter shorter. Conversely, do not repeat equivalent equations or insert decorative algebra. Each displayed calculation must advance the model, connect to accepted evidence, and lead to an interpretable result.

Every block equation must have:
- A text lead-in BEFORE: "将式~\eqref{eq:1}代入式~\eqref{eq:2}，化简可得：" / "Substituting Equation~\eqref{eq:1} into Equation~\eqref{eq:2}, we obtain:"
- An interpretation AFTER: "其中第一项表示...，参数 $\lambda$ 控制..." / "where the first term represents... and $\lambda$ controls..."
- NEVER present consecutive equations without connecting text between them.

All mathematical symbols must be defined at first occurrence.

### 5.6 Final-manuscript editing

Before final delivery, perform a manuscript edit separate from compilation. Delete internal production traces such as old/new-version labels, enhanced calculations, acceptance status, later backfilling, generated artifacts, figure metadata, evaluators, calculation identifiers, tool/file references, and delivery notes. Replace project-management wording with the exact mathematical object: write the model, variable, estimator, search range, comparison, or result rather than vague terms such as interface, convention, baseline, gate, revisit, landing, reuse, bound result, or result strength unless the term is a formally defined part of the problem.

Give each paragraph one job. Do not repeat a full numerical result in the abstract, problem analysis, model solution, results analysis, validation, evaluation, and conclusion. Full restatement normally belongs only in the abstract, the corresponding results discussion, and the final conclusion; elsewhere explain the cause, comparison, limitation, or implication. Present numbers at a precision supported by the input measurement, model uncertainty, validation error, and the decision threshold: two or three decimal places is a common starting point for engineering, management, prediction, and summary quantities, not a fixed rule. Keep guard digits in intermediate calculations, round only the reported presentation values, and retain extra digits when they change a ranking, feasibility decision, error bound, threshold comparison, confidence statement, or user-specified requirement. Avoid false precision, destructive over-rounding, and values displayed as zero when scientific notation or an explicit bound is needed. Keep the same metric, unit, scale, and decimal convention aligned across prose, tables, captions, figures, abstract, and conclusion.

Use consistent evidence strength and terminology. Do not interchange “corrected”, “eliminated”, and “suppressed”, or mix occurrence, insufficient evidence, and non-significance as if they were parallel categories. State the tested claim, evidence level, metric direction, and implication directly. Rewrite colloquial, translation-like, or noun-stacked phrases into complete sentences with an explicit subject, condition, and conclusion. This edit must preserve valid mathematical content; it removes presentation noise rather than shortening supported derivations or calculations.

### 5.7 Figure Placement and Analysis

Figures and tables must be placed at the point of first reference in the text, using the `[H]` float specifier. NEVER consolidate all figures into a separate "results display" section or a standalone figures chapter.

After every figure or table, write an analysis paragraph of at least 3 sentences that:
1. Describes the key observation (what the figure shows)
2. Interprets the observation (what it means for the problem)
3. Connects to the next step (how this informs the model or conclusion)

Bad practice:
```tex
\begin{figure}[H] ... \end{figure}
\begin{figure}[H] ... \end{figure}
\begin{figure}[H] ... \end{figure}
如图所示，结果符合预期。
```

Good practice:
```tex
\begin{figure}[H] ... \caption{...} \label{fig:q1_trend} \end{figure}

如图~\ref{fig:q1_trend}所示，黄河干流年径流量在 1960--2020 年间呈现显著的下降趋势，
平均每十年减少 12.3 亿立方米。特别值得注意的是，2000 年前后出现了一个明显的转折点，
此后径流量的下降速率从 15.1 亿立方米/十年骤降至 4.2 亿立方米/十年。
这一现象可能与小浪底水库投入运营（1999 年）密切相关，为我们后续建立分段回归模型提供了依据。
```

You cannot see image content. All descriptions of chart characteristics must come from reading the corresponding `.png.metadata` file, which contains Coder's automatically computed statistical insights (Autonomous Insights). Read metadata before writing analysis text.

Use non-breaking spaces for cross-references:
- Chinese: `如图~\ref{fig:x}所示`，`由式~\eqref{eq:x}可得`，`见表~\ref{tab:x}`
- English: `Figure~\ref{fig:x}`, `Equation~\eqref{eq:x}`, `Table~\ref{tab:x}`

Image paths: Since images are copied into `mma/{work_name}/writer/figure/`, use `figure/<filename>`:
```tex
\includegraphics[width=0.8\textwidth]{figure/fig1.png}
```

A strong contest paper typically contains 8-15 figures. If available charts are insufficient, clearly state what additional charts are needed in your response; Coordinator will arrange Coder to generate them.

