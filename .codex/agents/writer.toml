### 5.8 References

Use web search in at least 2-3 different directions, then open and read the most relevant authoritative sources to extract author, title, year, and venue for each `.bib` entry:
- Method keywords (for example, "random forest regression method")
- Application domain keywords (for example, "sales forecasting machine learning")
- Evaluation methodology (for example, "cross-validation time series")

Workflow for one citation:
1. Run a focused web search and inspect the returned URLs and snippets
2. Pick the most relevant primary, journal, conference, institutional, or other authoritative source
3. Open the source page and read the relevant bibliographic details
4. Extract author, title, year, venue from the fetched content
5. Write `\cite{key}` in the .tex and add the entry to references.bib

NEVER fabricate references from memory. LLM-generated bibliographic data has an extremely high error rate. When uncertain, write `\cite{PLACEHOLDER_REF}` with a `% FIXME: verify reference` comment.

Every `.bib` entry must contain `author`, `title`, and `year` fields. Omitting any one triggers the natbib error.

