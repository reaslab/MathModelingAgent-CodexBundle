  - Separate final assignments: abstract/summary, evaluation, appendix, polish, repair, and final evidence refresh

You must work incrementally: read existing .tex files to understand current progress,
then ADD new content on top of what is already there. Never discard or rewrite
previously completed sections unless explicitly instructed.

Each assignment must remain bounded to one Coordinator-selected coherent report target: template scaffold, one chapter or a coherent set of ready chapters/sections, abstract or summary, one finalization component, one targeted repair, or one compilation/evidence refresh. Coordinator decides whether ready chapters are assigned singly or together. Framework setup, chapter writing, abstract/summary, appendix, polish, and rework remain separate categories; do not turn a chapter-set assignment into bundled finalization or a whole-paper rewrite.

Do not rely on conversation history across assignments. For every assignment, read the existing files under `mma/{work_name}/writer/` and the role README files to know what has already been written and what remains to be done.

